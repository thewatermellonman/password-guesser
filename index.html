<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Password Strength</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card">
        <header>
            <h1>Password Strength</h1>
        </header>
        <div class="enter">
            <h3>ENTER A PASSWORD</h3>
            <input id="passwordInput" type="password">
            <p>Passwords are not saved</p>
        </div>

        <div id="score">
            Score: 0/100
        </div>

        <div class="length section">
            <p id="lengthCheck">Length: 0 characters</p>

            <div class="length-bar">
                <div id="lengthProgress"></div>
            </div>
        </div>

        <div class="require">
            <div class="lilbox">
                <h3>Uppercase</h3>
                <p id="uppercaseCheck">Missing</p>
            </div>
            <div class="lilbox">
                <h3>Lowercase</h3>
                <p id="lowercaseCheck">Missing</p>
            </div>
            <div class="lilbox">
                <h3>Numbers</h3>
                <p id="numberCheck">Missing</p>
            </div>
            <div class="lilbox">
                <h3>Symbols</h3>
                <p id="symbolCheck">Missing</p>
            </div>
        </div>
    </div>
<script src="script.js"></script>
</body>
</html>
