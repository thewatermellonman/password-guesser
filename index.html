<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Password Strength</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card">
        <header>
            <h1>Password Strength</h1>
        </header>
        <div class="enter">
            <h3>ENTER A PASSWORD</h3>
            <input id="passwordInput" type="password">
            <p>Passwords are not saved</p>
        </div>

        <div id="score">
            Score: 0/100
        </div>

        <ul class="list">
            <li id="lengthCheck">Length: 0 characters</li>
            <li id="uppercaseCheck">Uppercase: 0</li>
            <li id="lowercaseCheck">Lowercase: 0</li>
            <li id="numberCheck">Numbers: 0</li>
            <li id="symbolCheck">Symbols: 0</li>
        </ul>

        <div class="lilbox">
            <h3>Length</h3>
            <p id="lengthCheck">Length: 0 characters</p>
        </div>
    </div>
<script src="script.js"></script>
</body>
</html>
